name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # every version listed in requires-python (>=3.11) that is still maintained
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install locked dependencies
        run: uv sync --locked --python ${{ matrix.python-version }}

      - name: Build the package
        run: uv build --python ${{ matrix.python-version }}

      - name: Run tests
        run: uv run --locked --python ${{ matrix.python-version }} pytest
