name: Release

# Creates a GitHub release (and the tag `v<version>`) for the version in pyproject.toml
# and attaches the built wheel and sdist. Runs on pushes to main and on manual dispatch.
# If the tag already exists, nothing is released, so pushes that do not bump the version are no-ops.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Build and release
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - name: Check out the repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install locked dependencies
        run: uv sync --locked

      - name: Run tests
        run: uv run --locked pytest

      - name: Read version and check for an existing tag
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(uv version --short)"
          tag="v${version}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

          if git rev-parse -q --verify "refs/tags/${tag}" >/dev/null \
             || git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null 2>&1; then
            echo "Tag ${tag} already exists; nothing to release."
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            # anything other than X.Y.Z (e.g. 1.0.0a1, 1.0.0rc1, 1.0.0.dev2) is a pre-release
            if [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "prerelease=false" >> "$GITHUB_OUTPUT"
            else
              echo "prerelease=true" >> "$GITHUB_OUTPUT"
            fi
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "Releasing ${tag}"
          fi

      - name: Build the package
        if: steps.version.outputs.release == 'true'
        run: uv build

      - name: Create release and attach artifacts
        if: steps.version.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
        run: |
          args=(--target "$GITHUB_SHA" --title "$TAG" --generate-notes)
          if [[ "$PRERELEASE" == "true" ]]; then
            args+=(--prerelease)
          fi
          gh release create "$TAG" "${args[@]}" dist/*.whl dist/*.tar.gz
