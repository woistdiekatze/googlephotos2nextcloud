[project]
name = "gp2nc"
version = "0.1.0"
description = "Import a Google Photos Takeout into Nextcloud over WebDAV"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "python-dotenv>=1.0",
    "Pillow>=10.0",
]

[project.optional-dependencies]
# lets Pillow read HEIC/HEIF EXIF data
heif = [
    "pillow-heif>=0.16",
]

[project.scripts]
gp2nc = "gp2nc.importer:main"

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
